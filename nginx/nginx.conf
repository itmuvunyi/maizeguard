events { worker_connections 1024; }
http {
    client_max_body_size 300m;
    upstream maizeguard_api {
        server api:8000;          # resolves to every scaled "api" container (round robin)
    }
    server {
        listen 80;
        location / {
            proxy_pass http://maizeguard_api;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}

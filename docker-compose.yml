# Start:           docker compose up -d --build
# Scale the API:   docker compose up -d --scale api=3   (then: docker compose restart nginx)
services:
  api:
    build: .
    image: maizeguard
    environment:
      - RETRAIN_THRESHOLD=50
    volumes:
      - ./models:/app/models      # shared, so every container picks up a retrained model
      - ./data:/app/data          # shared database + train/test images
    expose:
      - "8000"
    restart: unless-stopped

  nginx:                          # load balancer in front of the API containers
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  ui:
    image: maizeguard
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://nginx
    ports:
      - "8501:8501"
    depends_on:
      - nginx
    restart: unless-stopped
